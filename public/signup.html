<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>At Home – Sign up</title><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/icon-192.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#131838">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap" rel=stylesheet>
<style>body{margin:0;font-family:Fredoka,system-ui,sans-serif;background:linear-gradient(#131838,#2a1b5a) fixed;color:#eef0ff;min-height:100vh}main{max-width:520px;margin:auto;padding:22px 16px 60px}h1{font-size:30px;margin:8px 0}p,small{color:#aab0e0}.c{background:#232b5c;border-radius:24px;padding:18px;margin:14px 0}label{display:block;margin:12px 0 4px;font-weight:600}input,select{width:100%;box-sizing:border-box;padding:13px;border-radius:14px;border:2px solid #3a4390;background:#1b2150;color:#fff;font:inherit;font-size:18px}button{font:inherit;font-weight:700;font-size:20px;border:0;border-radius:40px;padding:14px 22px;background:#8aeefa;color:#10204a;box-shadow:0 5px 0 #4aa9c4;cursor:pointer;width:100%;margin-top:16px}.lg{display:flex;gap:6px;justify-content:center}.lg button{width:auto;margin:0;padding:6px 16px;font-size:15px;box-shadow:none;background:#2a3170;color:#aab0e0}.lg button.on{background:#6b57c7;color:#fff}.code{font-size:34px;letter-spacing:3px;text-align:center;color:#ffd76a;background:#10143a;border-radius:16px;padding:10px;margin:10px 0}.err{color:#ff9a9a;margin-top:8px}.hp{position:absolute;left:-9999px}a{color:#8aeefa}.big{font-size:22px;color:#fff}</style>
<main><img src="/logo.webp" alt="At Home" style="display:block;height:64px;margin:0 auto 8px"><div class=lg><button id=b-en onclick="L('en')">English</button><button id=b-es onclick="L('es')">Español</button></div>
<h1 data-k=h></h1><p data-k=sub></p>
<div class=c id=form>
<label data-k=parent></label><input id=parent autocomplete=name>
<label data-k=contact></label><input id=contact autocomplete=email>
<label data-k=child></label><input id=child>
<label data-k=grade></label><select id=grade><option value=0>PF<option value=1 selected>1<option value=2>2<option value=3>3<option value=4>4<option value=5>5</select>
<label data-k=school></label><select id=school onchange="so.style.display=this.value=='other'?'block':'none'"><option value="Colegio Continental">Colegio Continental</option><option value=other data-k=other></option></select><input id=so style="display:none;margin-top:8px">
<input class=hp id=website tabindex=-1 autocomplete=off>
<div class=err id=err></div><button onclick=send() data-k=send></button></div>
<div class=c id=done style="display:none"><b class=big data-k=thanks></b><div class=code id=code></div><p data-k=keep></p></div>
<div class=c><b data-k=checkT></b><p data-k=checkP></p><input id=chk placeholder="XXXX-XXXX"><button onclick=check() data-k=check></button><div id=res></div></div><p style="text-align:center"><a href="https://wa.me/18295561010?text=Hola%2C%20necesito%20ayuda%20con%20At%20Home" target=_blank>WhatsApp: 829-556-1010</a></p></main>
<script>
const T={en:{h:'Join At Home!',sub:'Fill in the form. We will review it and approve it within 24 hours.',parent:'Parent or guardian name',contact:'Email or WhatsApp number',child:"Child's first name",grade:'Grade',school:'School',other:'Other school',send:'Send request',thanks:'Request received! Your request code:',keep:'Save this code. We usually approve within 24 hours. Come back to this page and use "Check my request" to see when it is ready.',checkT:'Check my request',checkP:'Already sent a request? Enter your code.',check:'Check',fill:'Please fill in every box.',pend:h=>'Still waiting for approval. This can take up to 24 hours (about '+h+' left). Please check again later.',ok:u=>'Approved! Your username: '+u,rej:r=>'Sorry, this request was not approved.'+(r?' '+r:''),nf:'We could not find that code.',go:'Open the app',err:'Something went wrong. Please try again.'},
es:{h:'¡Únete a At Home!',sub:'Llena el formulario. Lo revisaremos y lo aprobaremos en un máximo de 24 horas.',parent:'Nombre del padre, madre o tutor',contact:'Correo o número de WhatsApp',child:'Nombre del niño o la niña',grade:'Grado',school:'Colegio',other:'Otro colegio',send:'Enviar solicitud',thanks:'¡Solicitud recibida! Tu código:',keep:'Guarda este código. Normalmente aprobamos en 24 horas. Vuelve a esta página y usa "Revisar mi solicitud" para ver cuándo está lista.',checkT:'Revisar mi solicitud',checkP:'¿Ya enviaste una solicitud? Escribe tu código.',check:'Revisar',fill:'Por favor llena todas las casillas.',pend:h=>'Todavía esperando aprobación. Puede tardar hasta 24 horas (faltan unas '+h+'). Vuelve más tarde a revisar.',ok:u=>'¡Aprobado! Tu usuario: '+u,rej:r=>'Lo sentimos, esta solicitud no fue aprobada.'+(r?' '+r:''),nf:'No encontramos ese código.',go:'Abrir la aplicación',err:'Algo salió mal. Inténtalo de nuevo.'}};
let lg=(navigator.language||'en').startsWith('es')?'es':'en';
function L(x){lg=x;document.querySelectorAll('[data-k]').forEach(e=>e.textContent=T[lg][e.dataset.k]);['en','es'].forEach(k=>document.getElementById('b-'+k).className=k==lg?'on':'')}
async function send(){err.textContent='';const b={parent:parent.value,contact:contact.value,child:child.value,grade:grade.value,school:school.value=='other'?so.value:school.value,website:website.value};
 if(!b.parent.trim()||!b.contact.trim()||!b.child.trim()||!b.school.trim())return err.textContent=T[lg].fill;
 try{const r=await fetch('/api/signup',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}),j=await r.json();if(!r.ok)return err.textContent=j.error||T[lg].err;form.style.display='none';done.style.display='block';code.textContent=j.code;chk.value=j.code}catch(e){err.textContent=T[lg].err}}
async function check(){res.innerHTML='';try{const r=await fetch('/api/signup-status?code='+encodeURIComponent(chk.value)),j=await r.json();if(!r.ok)return res.innerHTML='<p class=err>'+T[lg].nf+'</p>';
 if(j.status=='pending')res.innerHTML='<p>'+T[lg].pend(j.hoursLeft)+'</p>';else if(j.status=='approved')res.innerHTML='<p class=big>'+T[lg].ok(j.username,j.pin)+'</p><a href="/">'+T[lg].go+'</a>';else res.innerHTML='<p class=err>'+T[lg].rej(j.reason)+'</p>'}catch(e){res.innerHTML='<p class=err>'+T[lg].err+'</p>'}}
L(lg);const q=new URLSearchParams(location.search).get('code');if(q){chk.value=q;check()}
</script>
