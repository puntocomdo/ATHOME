 S.list.map((x,i)=>`<div class="row"><span>${esc(x.w)}</span><span class="mini"><button onclick="say(S.list[${i}].w)">${ICO.spk}</button><button onclick="say(S.list[${i}].d)">${ICO.book}</button><button onclick="say(S.list[${i}].s)">${ICO.chat}</button><button onclick="mic(S.list[${i}].w,'m${i}')">${ICO.mic}</button></span><span style="color:${S.res[i]?"var(--ok)":"var(--rd)"}">${S.res[i]?"✔":"✘"}</span></div><div class="fb" id="m${i}"></div>`).join("")+
 `</div>${star?`<button class="w trophy" onclick="cert(${n},${tot})">${t("Make my trophy picture!")}</button>`:""}<button class="w g" onclick="startQuiz()">${t("TRY AGAIN")}</button><button class="w" style="background:var(--pu)" onclick="shop()">${t("GEM SHOP")} (${P.gems})</button><button class="w o" onclick="home()">${t("Back to weeks")}</button>`;
 sayQ(t(win?"Amazing!":"Good try!"),t("Your score is")+" "+n+" "+t("of")+" "+tot);if(win)confetti()}
function cert(n,tot){$.innerHTML=`<h1 style="text-align:center">${t("Super speller!")}</h1><div class="card"><p class="tag">${t("Take a picture or choose one. It stays on this device.")}</p>
 <input id="pf" type="file" accept="image/*" capture="user" style="display:none" onchange="certMake(this.files[0],${n},${tot})"><button class="w trophy" onclick="document.getElementById('pf').click()">${t("Take or choose a photo")}</button>
 <button class="w o" onclick="certMake(null,${n},${tot})">${t("No photo, just the trophy")}</button></div><button class="w o" onclick="home()">${t("Back")}</button>`;sayQ(t("Super speller!"))}
function certMake(f,n,tot){const col=["#ff595e","#ffca3a","#8ac926","#1982c4","#6a4c93"];
 const go=img=>{const c=document.createElement("canvas");c.width=900;c.height=1200;const x=c.getContext("2d");
  const g=x.createLinearGradient(0,0,900,1200);g.addColorStop(0,"#fff3c4");g.addColorStop(1,"#cfeaf0");x.fillStyle=g;x.fillRect(0,0,900,1200);
  for(let i=0;i<160;i++){x.fillStyle=col[i%5];const px=60+Math.random()*780,py=60+Math.random()*1080;if(px>120&&px<780&&py>240&&py<1020)continue;x.save();x.translate(px,py);x.rotate(Math.random()*6);x.fillRect(-6,-9,12,18);x.restore()}
  x.lineWidth=18;x.strokeStyle="#f5b83d";x.strokeRect(24,24,852,1152);x.lineWidth=6;x.strokeStyle="#7b68b5";x.strokeRect(46,46,808,1108);
  const star=(cx,cy,r,fc)=>{x.fillStyle=fc;x.beginPath();for(let i=0;i<10;i++){const a=i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;x.lineTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a))}x.closePath();x.fill()};
  const tro=(cx,cy,s)=>{x.save();x.translate(cx,cy);x.scale(s,s);x.fillStyle="#f5b83d";x.strokeStyle="#d9900f";x.lineWidth=7;
   x.beginPath();x.arc(-44,-26,18,Math.PI/2,Math.PI*1.5);x.stroke();x.beginPath();x.arc(44,-26,18,-Math.PI/2,Math.PI/2);x.stroke();
   x.beginPath();x.moveTo(-42,-52);x.lineTo(42,-52);x.lineTo(42,-10);x.bezierCurveTo(42,26,16,42,0,42);x.bezierCurveTo(-16,42,-42,26,-42,-10);x.closePath();x.fill();
   x.fillRect(-8,40,16,24);x.fillStyle="#d9900f";x.fillRect(-32,64,64,14);star(0,-14,20,"#fff");x.restore()};
  [[120,150,1.2],[780,150,1.2],[120,1060,1.2],[780,1060,1.2],[110,520,1.5],[790,520,1.5],[130,760,1.1],[770,760,1.1]].forEach(a=>tro(...a));
  [[200,300,28],[700,300,28],[220,980,24],[680,980,24],[450,95,30],[300,215,18],[600,215,18]].forEach(a=>star(a[0],a[1],a[2],"#ffca3a"));
  x.save();x.beginPath();x.arc(450,560,210,0,7);x.clip();x.fillStyle="#fff";x.fillRect(240,350,420,420);
  const s=Math.max(420/img.width,420/img.height);x.drawImage(img,450-img.width*s/2,560-img.height*s/2,img.width*s,img.height*s);x.restore();
  x.lineWidth=16;x.strokeStyle="#7b68b5";x.beginPath();x.arc(450,560,218,0,7);x.stroke();
  x.textAlign="center";x.fillStyle="#7b68b5";x.font="84px 'Gochi Hand',cursive";x.fillText(t("SUPER SPELLER!"),450,190);
  x.fillStyle="#f28c28";x.font="84px 'Gochi Hand',cursive";x.fillText(name(),450,880);
  x.fillStyle="#3b3358";x.font="52px 'Gochi Hand',cursive";x.fillText(lab(S.week)+"  ·  "+n+"/"+tot+"  ("+Math.round(100*n/tot)+"%)",450,950);
  x.font="42px 'Gochi Hand',cursive";x.fillText(S.user.school||"",450,1025);x.fillText(new Date().toLocaleDateString(),450,1090);
  const url=c.toDataURL("image/png");
  $.innerHTML=`<h1 style="text-align:center">${t("Great spelling!")}</h1><p class="tag">${t("Show this to your family!")}</p><img src="${url}" alt="" style="width:100%;border-radius:18px;border:4px solid var(--ye)">
  <a class="trophy" download="trophy-${esc(name())}.png" href="${url}" style="display:block;text-align:center;text-decoration:none;color:#fff;font-size:26px;border-radius:40px;padding:14px;margin-top:12px">${t("Download my picture")}</a>
  <p class="tag">${t("If the button does not save, press and hold the picture and choose Save.")}</p><button class="w o" onclick="home()">${t("Back")}</button>`;confetti()};
 const im=new Image();im.onload=()=>go(im);
 if(f){const r=new FileReader();r.onload=()=>{im.src=r.result};r.readAsDataURL(f)}else im.src=IMG["a_"+P.av]}
function shop(m){$.innerHTML=`<div class="top"><h1>${t("Gem Shop")}</h1><div class="gem"><img src="${IMG.gem}" alt=""><i>${P.gems}</i></div></div><p>${m||t("Spend your gems to unlock new avatars!")}</p><div class="shopg">`+
 [...AV].sort((a,b)=>a.c-b.c).map(a=>{const own=P.own.includes(a.id),on=P.av===a.id;return `<div class="card"><img class="av" src="${IMG["a_"+a.id]}" alt=""><div class="ch">${t(a.n)}</div>`+
 (own?`<button class="${on?"g":""}" onclick="useAv('${a.id}')">${t(on?"Using":"Use")}</button>`:`<button ${P.gems<a.c?"disabled":""} onclick="buy('${a.id}')">${a.c} ${t("gems")}</button>`)+`</div>`}).join("")+
 `</div><button class="w o" onclick="home()">${t("Back")}</button>`}
function buy(id){const a=AV.find(x=>x.id==id);if(P.gems<a.c)return;P.gems-=a.c;P.own.push(id);P.av=id;save();shop(t("You unlocked")+" "+t(a.n)+"!")}
function useAv(id){P.av=id;save();shop()}
if(S.user&&!CODES[S.user.code])S.user=null;if(S.user){S.user.grade=CODES[S.user.code];S.user.school=STUDENTS[S.user.code].school}if(S.user&&!expired()){loadP();home()}else login();
</script></body></html>
