<!doctype html><html lang=es><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>At Home – Words</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/icon-192.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{--bg:#f4f1fb;--ink:#2b2750;--mut:#6f6a93;--pu:#6b57c7;--ok:#2e9e5b;--bad:#d64545}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
header{background:#fff;border-bottom:1px solid #e3def5;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}header img{height:42px}header nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}
a.nv,.lang button{padding:7px 14px;border-radius:20px;text-decoration:none;color:var(--pu);font-weight:600;font-size:14px;border:1px solid #d9d2f3;background:#fff;cursor:pointer}a.nv.on,.lang button.on{background:var(--pu);color:#fff;border-color:var(--pu)}.lang{display:flex;gap:4px}
main{max-width:1400px;margin:auto;padding:16px}h1{font-size:24px;margin:6px 0 2px}.sub{color:var(--mut);margin:0 0 12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.bar select,.bar input{padding:10px;border-radius:12px;border:2px solid #ddd6f5;font-size:15px}.bar input[type=search]{flex:1;min-width:180px}
button.bt{padding:10px 16px;border:0;border-radius:12px;font-size:14px;font-weight:800;cursor:pointer;color:#fff;background:var(--pu)}button.ok{background:var(--ok)}button.no{background:#fff;color:var(--bad);border:2px solid var(--bad)}button.ghost{background:#fff;color:var(--pu);border:2px solid #d9d2f3}
.tw{overflow:auto;background:#fff;border-radius:16px;box-shadow:0 2px 8px #6b57c71a}table{border-collapse:collapse;width:100%;min-width:1100px}th{position:sticky;top:0;background:#ece8fb;text-align:left;padding:8px;font-size:12px;color:var(--mut);text-transform:uppercase}
td{padding:5px 6px;border-top:1px solid #eee;vertical-align:top}td input,td select,td textarea{width:100%;padding:7px;border:1.5px solid #e1dcf4;border-radius:8px;font:inherit;font-size:14px}td textarea{min-height:52px;resize:vertical}td input[type=checkbox]{width:auto}
tr.new td{background:#f2fbf5}tr.dirty td{background:#fff8e6}.th{width:44px;height:44px;border-radius:8px;object-fit:cover;background:#eee;margin-top:4px}.w1{width:62px}.w2{width:74px}.act{white-space:nowrap}
.pg{display:flex;gap:10px;align-items:center;justify-content:center;margin:14px 0}.ov{position:fixed;inset:0;background:#2b275099;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.ov.on{display:flex}.md{background:#fff;border-radius:22px;padding:22px;max-width:420px;width:100%}.md h2{margin:0 0 6px}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2b2750;color:#fff;padding:12px 20px;border-radius:14px;opacity:0;transition:.3s;pointer-events:none;z-index:30}#toast.on{opacity:1}
</style>
<header><img src="/logo.webp" alt="At Home"><nav><a class=nv href="/admin" data-k=nav1></a><a class="nv on" href="/words" data-k=nav4></a><a class=nv href="/teacher" data-k=nav2></a></nav><div class=lang><button id=l-es onclick="L('es')">ES</button><button id=l-en onclick="L('en')">EN</button></div></header>
<main><h1 data-k=h></h1><p class=sub id=sum></p>
<div class=bar><select id=fl onchange="off=0;load()"><option value="" data-k=allL></option><option value=en>English</option><option value=es>Español</option></select>
<select id=fg onchange="off=0;load()"><option value="" data-k=allG></option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
<select id=ff onchange="off=0;load()"><option value="" data-k=fAll></option><option value=incomplete data-k=fInc></option><option value=nophoto data-k=fNo></option></select><select id=ps onchange="PAGE=+this.value;off=0;load()"><option>100</option><option>250</option><option>500</option><option>1000</option></select>
<input type=search id=q data-k=ph oninput="clearTimeout(tm);tm=setTimeout(()=>{off=0;load()},350)">
<button class="bt ok" id=ap onclick="autoPhotos()" data-k=auto></button><button class="bt ghost" onclick="document.getElementById('file').click()" data-k=imp></button><button class="bt ghost" onclick="exportCsv()" data-k=exp></button><input type=file id=file accept=".csv,text/csv" hidden onchange="importCsv(this.files[0])"></div>
<div id=seed></div><div class=tw><table id=tb></table></div><div class=pg><button class="bt ghost" onclick="off=Math.max(0,off-PAGE);load()" data-k=prev></button><span id=pn></span><button class="bt ghost" onclick="off+=PAGE;load()" data-k=next></button></div></main>
<div class=ov id=ov><div class=md id=md></div></div><div id=toast></div>
<script>
const _f=window.fetch.bind(window);let TK=localStorage.getItem('adm_tk')||'';
window.fetch=(u,o={})=>{o.headers=Object.assign({'x-admin-token':TK},o.headers||{});return _f(u,o).then(r=>{if(r.status==401&&String(u).startsWith('/api/')&&u!='/api/admin-login')needLogin();return r})};
const TT={es:{nav1:'Solicitudes',nav2:'Progreso',nav4:'Palabras',h:'Palabras',ph:'Buscar palabra, definición u oración…',allL:'Todos los idiomas',allG:'Todos los grados',fAll:'Todas las palabras',fInc:'Sin definición u oración',fNo:'Sin foto',auto:'Buscar fotos automáticamente',stop:'Detener',photosAdded:'Fotos agregadas',left:'faltan',find:'Buscar foto',pickT:'Elige una foto',pickQ:'Buscar',pickNone:'No encontré fotos.',seedT:'Tu tabla está vacía.',seedB:'Cargar las palabras que vienen con la app',seeding:'Cargando palabras…',seedDone:'Palabras cargadas',st:(t,i,n)=>`${t} palabras · ${i} sin definición u oración · ${n} sin foto`,imp:'Importar CSV',exp:'Exportar CSV',prev:'‹ Anterior',next:'Siguiente ›',add:'Agregar',save:'Guardar',del:'Borrar',delq:'¿Borrar esta palabra?',saved:'Guardado',added:'Palabra agregada',deleted:'Borrada',cols:['Idioma','Grado','Unidad','Semana','Palabra','Definición','Oración','Foto (archivo)','Colegio','Sin foto','Activa',''],newR:'NUEVA',err:'Algo salió mal.',imported:'Importadas',of:'de',adminT:'Código de administrador',adminS:'Escribe tu código para entrar.',adminPh:'Código',enter:'Entrar',showing:(a,b,t)=>`Mostrando ${a}–${b} de ${t}`,sum:'Edita cualquier casilla y toca Guardar. Una semana aparece en la app cuando todas sus palabras tienen definición y oración. Colegio vacío = todos.',hint:'colegio vacío = todos',none:'No hay palabras. Importa tu CSV o agrega una.'},
en:{nav1:'Requests',nav2:'Progress',nav4:'Words',h:'Words',ph:'Search word, definition or sentence…',allL:'All languages',allG:'All grades',fAll:'All words',fInc:'Missing definition or sentence',fNo:'No photo yet',auto:'Find photos automatically',stop:'Stop',photosAdded:'Photos added',left:'left',find:'Find photo',pickT:'Choose a photo',pickQ:'Search',pickNone:'No photos found.',seedT:'Your table is empty.',seedB:'Load the words that came with the app',seeding:'Loading words…',seedDone:'Words loaded',st:(t,i,n)=>`${t} words · ${i} missing definition or sentence · ${n} without a photo`,imp:'Import CSV',exp:'Export CSV',prev:'‹ Previous',next:'Next ›',add:'Add',save:'Save',del:'Delete',delq:'Delete this word?',saved:'Saved',added:'Word added',deleted:'Deleted',cols:['Language','Grade','Unit','Week','Word','Definition','Sentence','Photo (file)','School','No photo','Active',''],newR:'NEW',err:'Something went wrong.',imported:'Imported',of:'of',adminT:'Admin code',adminS:'Enter your code to continue.',adminPh:'Code',enter:'Enter',showing:(a,b,t)=>`Showing ${a}–${b} of ${t}`,sum:'Edit any box and tap Save. A week shows in the app when all its words have a definition and a sentence. Empty school = every school.',hint:'empty = all schools',none:'No words yet. Import your CSV or add one.'}};
let lg=localStorage.getItem('adm_lg')||'es',rows=[],total=0,off=0,tm=0;let PAGE=100;const T=k=>TT[lg][k],$=id=>document.getElementById(id),H=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
function L(x){lg=x;localStorage.setItem('adm_lg',x);document.documentElement.lang=x;document.querySelectorAll('[data-k]').forEach(e=>{const v=T(e.dataset.k);if(e.tagName=='INPUT')e.placeholder=v;else e.textContent=v});$('l-es').className=x=='es'?'on':'';$('l-en').className=x=='en'?'on':'';$('sum').textContent=ST?T('st')(ST.total,ST.incomplete,ST.nophoto):T('sum');draw()}
function toast(m){const t=$('toast');t.textContent=m;t.className='on';setTimeout(()=>t.className='',2200)}
function open_(h){$('md').innerHTML=h;$('ov').className='ov on'}function close_(){$('ov').className='ov';$('md').innerHTML=''}
function needLogin(){if($('ac'))return;open_(`<h2>${T('adminT')}</h2><p>${T('adminS')}</p><input id=ac type=password placeholder="${T('adminPh')}" onkeydown="if(event.key=='Enter')adminLogin()" style="width:100%;padding:12px;border-radius:12px;border:2px solid #ddd6f5;font-size:18px"><div id=ae style="color:#d64545;min-height:22px;margin:6px 0"></div><button class="bt" onclick="adminLogin()">${T('enter')}</button>`)}
async function adminLogin(){const r=await fetch('/api/admin-login',{method:'POST',body:JSON.stringify({code:$('ac').value})}),j=await r.json();if(!r.ok){$('ae').textContent=j.error||T('err');return}TK=j.token;localStorage.setItem('adm_tk',TK);close_();load()}
async function post(u,b){const r=await fetch(u,{method:'POST',body:JSON.stringify(b)}),j=await r.json();if(!r.ok){if(r.status!=401)toast(j.error||T('err'));throw 0}return j}
async function load(){try{const p=new URLSearchParams({limit:PAGE,offset:off});if($('fl').value)p.set('lang',$('fl').value);if($('fg').value)p.set('grade',$('fg').value);if($('q').value.trim())p.set('q',$('q').value.trim());if($('ff').value)p.set($('ff').value,'1');
 const r=await fetch('/api/words-admin?'+p);if(r.ok){const j=await r.json();rows=j.rows;total=j.total}
 const s=await fetch('/api/words-stats');if(s.ok){const j=await s.json();$('sum').textContent=T('st')(j.total,j.incomplete,j.nophoto);ST=j}}catch(e){toast(T('err'))}draw()}
let ST=null;
async function seed(){$('seed').innerHTML=`<p class=sub>${T('seeding')}</p>`;try{const j=await post('/api/words-seed',{});toast(`${T('seedDone')}: ${j.imported}`)}catch(e){}load()}
let apRun=false;
async function autoPhotos(){if(apRun){apRun=false;return}apRun=true;$('ap').textContent=T('stop');let done=0,idle=0;
 try{while(apRun){const r=await fetch('/api/words-photos',{method:'POST',body:'{}'}),j=await r.json();if(!r.ok){toast(j.error||T('err'));break}done+=j.done;toast(`${T('photosAdded')}: ${done} · ${T('left')}: ${j.remaining}`);if(j.error){toast(j.error);break}if(!j.remaining)break;idle=j.done?0:idle+1;if(idle>=2)break;await new Promise(x=>setTimeout(x,9000))}}catch(e){}
 apRun=false;$('ap').textContent=T('auto');load()}
async function pf(i){const w=rows[i];open_(`<h2>${T('pickT')}</h2><div style="display:flex;gap:6px;margin:8px 0"><input id=pq value="${H(w.word)}" style="flex:1;padding:9px;border:2px solid #ddd6f5;border-radius:10px" onkeydown="if(event.key=='Enter')pgo(${i})"><button class=bt onclick="pgo(${i})">${T('pickQ')}</button></div><div id=pr style="display:flex;flex-wrap:wrap;gap:6px;min-height:60px"></div><button class="bt ghost" style="margin-top:10px" onclick="close_()">×</button>`);pgo(i)}
async function pgo(i){const w=rows[i];$('pr').innerHTML='…';try{const r=await fetch('/api/photo-search?q='+encodeURIComponent($('pq').value)+'&lang='+w.lang),j=await r.json();if(!r.ok){$('pr').textContent=j.error||T('err');return}
 window.__hits=j;$('pr').innerHTML=j.map((h,n)=>`<img src="${h.thumb}" style="width:88px;height:88px;object-fit:cover;border-radius:10px;cursor:pointer" onclick="pset(${i},${n})">`).join('')||T('pickNone')}catch(e){$('pr').textContent=T('err')}}
async function pset(i,n){$('pr').innerHTML='…';try{await post('/api/photo-set',{id:rows[i].id,url:window.__hits[n].full});close_();toast(T('saved'));load()}catch(e){$('pr').textContent=T('err')}}
const sel=(id,opts,v)=>`<select id="${id}" onchange="dirty(this)">${opts.map(o=>`<option value="${o[0]}" ${String(o[0])==String(v)?'selected':''}>${o[1]}</option>`).join('')}</select>`;
const LANGS=[['en','English'],['es','Español']],GR=[1,2,3,4,5].map(n=>[n,n]);
function rowHtml(w,i){const f=n=>`f_${i}_${n}`,cl=i=='n'?'new':'';
 return `<tr class="${cl}" id="r_${i}"><td class=w2>${sel(f('lang'),LANGS,w.lang)}</td><td class=w1>${sel(f('grade'),GR,w.grade)}</td><td class=w1><input id="${f('unit')}" type=number min=1 value="${w.unit}" oninput="dirty(this)"></td><td class=w1><input id="${f('week')}" type=number min=1 value="${w.week}" oninput="dirty(this)"></td>
 <td style="min-width:120px"><input id="${f('word')}" value="${H(w.word)}" oninput="dirty(this)"></td><td style="min-width:220px"><textarea id="${f('definition')}" oninput="dirty(this)">${H(w.definition)}</textarea></td><td style="min-width:220px"><textarea id="${f('sentence')}" oninput="dirty(this)">${H(w.sentence)}</textarea></td>
 <td style="min-width:130px"><input id="${f('photo')}" value="${H(w.photo)}" placeholder="cat.webp" oninput="dirty(this)">${i=='n'?'':`<button class="bt ghost" style="padding:5px 8px;margin-top:4px" onclick="pf(${i})">${T('find')}</button>`}${w.photo?`<img class=th src="${/^(https?:)?\//.test(w.photo)?w.photo:'/photos/'+H(w.photo).replace(/^photos\//,'')}" onerror="this.style.display='none'">`:''}</td>
 <td style="min-width:120px"><input id="${f('school')}" value="${H(w.school)}" placeholder="${T('hint')}" oninput="dirty(this)"></td><td><input type=checkbox id="${f('sight')}" ${w.sight?'checked':''} onchange="dirty(this)"></td><td><input type=checkbox id="${f('active')}" ${w.active!==false?'checked':''} onchange="dirty(this)"></td>
 <td class=act>${i=='n'?`<button class="bt ok" onclick="add()">${T('add')}</button>`:`<button class="bt" onclick="sv(${i})">${T('save')}</button> <button class="bt no" onclick="dl(${i})">${T('del')}</button>`}</td></tr>`}
function draw(){
 $('tb').innerHTML='<tr>'+T('cols').map(c=>`<th>${c}</th>`).join('')+'</tr>'+rowHtml({lang:$('fl').value||'en',grade:$('fg').value||1,unit:1,week:1,word:'',definition:'',sentence:'',photo:'',school:'',sight:false,active:true},'n')+(rows.map(rowHtml).join('')||`<tr><td colspan=12 style="text-align:center;padding:30px;color:#6f6a93">${T('none')}</td></tr>`);
 $('pn').textContent=total?T('showing')(off+1,Math.min(off+PAGE,total),total):'';
 const empty=!total&&!$('q').value&&!$('ff').value&&!$('fl').value&&!$('fg').value&&ST&&ST.total===0;$('seed').innerHTML=empty?`<div style="background:#fff;border-radius:16px;padding:16px;margin-bottom:12px;text-align:center"><p style="margin:0 0 10px"><b>${T('seedT')}</b></p><button class="bt ok" onclick="seed()">${T('seedB')}</button></div>`:''}
function dirty(el){const tr=el.closest('tr');if(tr&&tr.id!='r_n')tr.className='dirty'}
const val=(i,n)=>{const e=$(`f_${i}_${n}`);return e.type=='checkbox'?e.checked:e.value};
const collect=i=>({lang:val(i,'lang'),grade:val(i,'grade'),unit:val(i,'unit'),week:val(i,'week'),word:val(i,'word'),definition:val(i,'definition'),sentence:val(i,'sentence'),photo:val(i,'photo'),school:val(i,'school'),sight:val(i,'sight'),active:val(i,'active')});
async function sv(i){const b=collect(i);b.id=rows[i].id;try{rows[i]=await post('/api/word-save',b);toast(T('saved'));$('r_'+i).className=''}catch(e){}}
async function add(){try{await post('/api/word-save',collect('n'));toast(T('added'));load()}catch(e){}}
async function dl(i){if(!confirm(T('delq')))return;try{await post('/api/word-delete',{id:rows[i].id});toast(T('deleted'));load()}catch(e){}}
function parseCsv(t){const R=[];let r=[],c='',q=false;t=t.replace(/^\uFEFF/,'');for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'&&t[i+1]=='"'){c+='"';i++}else if(ch=='"')q=false;else c+=ch}else if(ch=='"')q=true;else if(ch==','){r.push(c);c=''}else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;r.push(c);c='';if(r.some(x=>x))R.push(r);r=[]}else c+=ch}if(c||r.length){r.push(c);R.push(r)}return R}
async function importCsv(file){if(!file)return;const R=parseCsv(await file.text()),h=R[0].map(x=>x.toLowerCase().trim()),ix=f=>h.findIndex(f);
 const c={grade:ix(x=>x=='grade'),school:ix(x=>x.startsWith('school')),uw:ix(x=>x.includes('unit')),word:ix(x=>x=='word'),lang:ix(x=>x=='language'||x=='lang'),def:ix(x=>x.startsWith('definition')),sent:ix(x=>x.startsWith('sentence')),photo:ix(x=>x.startsWith('photo')),sight:ix(x=>x=='sight'),active:ix(x=>x=='active')};
 const g=(r,k)=>c[k]<0?'':(r[c[k]]||'').trim(),out=[];
 for(const r of R.slice(1)){const m=g(r,'uw').match(/(\d+)\D+(\d+)/);if(!g(r,'word'))continue;out.push({grade:g(r,'grade'),school:g(r,'school'),unit:m?m[1]:1,week:m?m[2]:1,word:g(r,'word'),lang:/^(es|span)/i.test(g(r,'lang'))?'es':'en',definition:g(r,'def'),sentence:g(r,'sent'),photo:g(r,'photo').replace(/^photos\//,''),sight:/^(1|true|yes|si|sí)$/i.test(g(r,'sight')),active:!/^(0|false|no)$/i.test(g(r,'active'))})}
 try{for(let i=0;i<out.length;i+=300){await post('/api/words-import',{rows:out.slice(i,i+300)});toast(`${T('imported')} ${Math.min(i+300,out.length)} ${T('of')} ${out.length}`)}}catch(e){return}$('file').value='';load()}
async function exportCsv(){let all=[];for(let o=0;;o+=1000){const r=await fetch('/api/words-admin?limit=1000&offset='+o);if(!r.ok)return;const j=await r.json();all=all.concat(j.rows);if(all.length>=j.total||!j.rows.length)break}
 const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"',H1=['GRADE','SCHOOL (blank = every school)','UNIT # WEEK #','WORD','LANGUAGE','DEFINITION','SENTENCE','PHOTO FILE (example: cat.jpg)','SIGHT','ACTIVE'];
 const csv='\uFEFF'+[H1.map(q).join(',')].concat(all.map(w=>[w.grade,w.school,`UNIT ${w.unit} WEEK ${w.week}`,w.word.toUpperCase(),w.lang=='es'?'SPANISH':'ENGLISH',w.definition,w.sentence,w.photo,w.sight?'yes':'no',w.active?'yes':'no'].map(q).join(','))).join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='words.csv';a.click()}
L(lg);load();
</script></html>
