<!doctype html><html lang=es><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>At Home – Admin</title><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" href="/icon-192.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><meta name="theme-color" content="#131838">
<style>
:root{--bg:#f4f1fb;--ink:#2b2750;--mut:#6f6a93;--pu:#6b57c7;--te:#2fb7c9;--ok:#2e9e5b;--bad:#d64545;--or:#f28c28}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
header{background:#fff;border-bottom:1px solid #e3def5;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:5}header img{height:42px}
header nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}a.nv,.lang button{padding:7px 14px;border-radius:20px;text-decoration:none;color:var(--pu);font-weight:600;font-size:14px;border:1px solid #d9d2f3;background:#fff;cursor:pointer}.lang button.on{background:var(--pu);color:#fff;border-color:var(--pu)}.lang{display:flex;gap:4px}
main{max-width:900px;margin:auto;padding:16px}h1{font-size:24px;margin:6px 0 2px}.sub{color:var(--mut);margin:0 0 14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.tab{padding:10px 16px;border-radius:14px;border:2px solid #ddd6f5;background:#fff;font-weight:700;cursor:pointer;color:var(--mut)}.tab.on{background:var(--pu);border-color:var(--pu);color:#fff}.tab i{font-style:normal;background:#ece8fb;color:var(--pu);border-radius:10px;padding:1px 8px;margin-left:6px;font-size:13px}.tab.on i{background:#fff3}.tab.on i{color:#fff}
.search{width:100%;padding:12px 14px;border-radius:14px;border:2px solid #ddd6f5;font-size:16px;margin-bottom:12px}
.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;border-left:8px solid #ddd6f5;box-shadow:0 2px 8px #6b57c71a}.card.pending{border-color:var(--or)}.card.late{border-color:var(--bad)}.card.approved{border-color:var(--ok)}.card.rejected{border-color:#bbb}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}.nm{font-size:21px;font-weight:800}.chip{display:inline-block;background:#ece8fb;color:var(--pu);border-radius:12px;padding:3px 10px;font-size:13px;font-weight:700;margin-left:6px}
.b{padding:4px 12px;border-radius:12px;font-size:13px;font-weight:800}.b.wait{background:#fff0dc;color:#b86400}.b.late{background:#ffe3e3;color:var(--bad)}.b.ok{background:#e0f5e8;color:var(--ok)}.b.no{background:#eee;color:#777}
.row{display:flex;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:14px;margin:8px 0}.row b{color:var(--ink)}.cp{cursor:pointer;border-bottom:1px dashed var(--mut)}
.act{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:10px;padding-top:12px;border-top:1px solid #eee}.act label{font-size:12px;color:var(--mut);display:block}.act select,.act input{padding:9px;border-radius:10px;border:2px solid #ddd6f5;font-size:15px}
button.bt,a.bt{padding:10px 18px;border:0;border-radius:12px;font-size:15px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block;color:#fff;background:var(--pu)}button.ok,a.ok{background:var(--ok)}button.no{background:#fff;color:var(--bad);border:2px solid var(--bad)}button.ghost{background:#fff;color:var(--pu);border:2px solid #d9d2f3}a.wa{background:#25d366}
.user{font-size:22px;font-weight:800;letter-spacing:.5px;background:#f4f1fb;border-radius:12px;padding:8px 14px;display:inline-block;cursor:pointer}
.empty{text-align:center;color:var(--mut);padding:40px 10px;background:#fff;border-radius:18px}
.ov{position:fixed;inset:0;background:#2b275099;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.ov.on{display:flex}.md{background:#fff;border-radius:22px;padding:22px;max-width:460px;width:100%}.md h2{margin:0 0 6px}.md .big{font-size:30px;font-weight:900;color:var(--ok);margin:8px 0;word-break:break-all}.md textarea{width:100%;padding:10px;border-radius:12px;border:2px solid #ddd6f5;font:inherit;min-height:70px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.chips span{background:#ece8fb;color:var(--pu);padding:5px 10px;border-radius:12px;font-size:13px;cursor:pointer}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2b2750;color:#fff;padding:12px 20px;border-radius:14px;opacity:0;transition:.3s;pointer-events:none;z-index:30}#toast.on{opacity:1}
</style>
<header><img src="logo.webp" alt="At Home"><nav><a class=nv href="/admin" data-k=nav1></a><a class=nv href="/words" data-k=nav4></a><a class=nv href="/teacher" data-k=nav2></a><a class=nv href="/review.html" data-k=nav3 style="display:none"></a><a class=nv href="#" onclick="localStorage.removeItem('adm_tk');location.reload();return false" data-k=out></a></nav><div class=lang><button id=l-es onclick="L('es')">ES</button><button id=l-en onclick="L('en')">EN</button></div></header>
<main><h1 data-k=h></h1><p class=sub id=sum></p><div class=tabs id=tabs></div><input class=search id=q data-k=ph oninput="draw()"><div id=list></div></main>
<div class=ov id=ov><div class=md id=md></div></div><div id=toast></div>
<script>
const TT={es:{nav1:'Solicitudes',nav2:'Progreso',nav3:'Fotos',nav4:'Palabras',adminT:'Código de administrador',adminS:'Escribe tu código para entrar.',adminPh:'Código',enter:'Entrar',out:'Salir',edit:'Editar',editT:'Editar cuenta',save:'Guardar',auto:'Automático',child:'Nombre del niño',saved:'Guardado',plus1y:'+1 año',plus6m:'+6 meses',today:'Hoy',expiry:'Fecha de vencimiento',userHint:'Letras y números, sin espacios',h:'Solicitudes de registro',ph:'Buscar por nombre, padre, contacto o usuario…',pending:'Esperando',approved:'Aprobadas',rejected:'Rechazadas',all:'Todas',waiting:'Esperando',overdue:'Pasó de 24 h',appr:'Aprobada',rej:'Rechazada',sent:'Enviada hace',h_:'h',left:'faltan',grade:'Grado',school:'Colegio',parent:'Padre/tutor',contact:'Contacto',approve:'Aprobar',reject:'Rechazar',copy:'Copiar',copied:'¡Copiado!',user:'Usuario',until:'Válida hasta',wa:'WhatsApp',mail:'Correo',msg:'Copiar mensaje',renew:'Renovar +1 año',renewq:'¿Renovar un año más?',renewed:'Renovada',code:'Código',nothing:'No hay solicitudes aquí.',sumA:(a,b)=>a+' esperando'+(b?' · '+b+' pasaron de 24 h':''),okT:'¡Aprobada!',okS:'Envíale esto al padre para que el niño pueda entrar:',autoMail:'También se envió un correo automático.',close:'Cerrar',rejT:'Rechazar solicitud',rejS:'Puedes escribir el motivo (opcional):',reasons:['No está inscrito en el colegio','Información incompleta','Solicitud repetida'],confirm:'Confirmar',cancel:'Cancelar',again:'Aprobar de todas formas',reason:'Motivo',err:'Algo salió mal. Revisa la conexión.',hello:'Hola',start:'Empieza en',fromStart:'Desde el inicio',uw:(u,w)=>'Unidad '+u+' · Semana '+w,startHint:'Las semanas antes de esta salen como ya hechas (las vieron en clase).',badNum:'El número de WhatsApp debe tener 10 dígitos (ej. 809 555 1234) o el código del país.',pickChat:'No hay número: WhatsApp se abre con el mensaje y tú eliges el chat.'},
en:{nav1:'Requests',nav2:'Progress',nav3:'Photos',nav4:'Words',adminT:'Admin code',adminS:'Enter your code to continue.',adminPh:'Code',enter:'Enter',out:'Log out',edit:'Edit',editT:'Edit account',save:'Save',auto:'Automatic',child:"Child's name",saved:'Saved',plus1y:'+1 year',plus6m:'+6 months',today:'Today',expiry:'Expiry date',userHint:'Letters and numbers, no spaces',h:'Sign-up requests',ph:'Search by child, parent, contact or username…',pending:'Waiting',approved:'Approved',rejected:'Rejected',all:'All',waiting:'Waiting',overdue:'Over 24 h',appr:'Approved',rej:'Rejected',sent:'Sent',h_:'h ago',left:'left',grade:'Grade',school:'School',parent:'Parent',contact:'Contact',approve:'Approve',reject:'Reject',copy:'Copy',copied:'Copied!',user:'Username',until:'Valid until',wa:'WhatsApp',mail:'Email',msg:'Copy message',renew:'Renew +1 year',renewq:'Renew for one more year?',renewed:'Renewed',code:'Code',nothing:'No requests here.',sumA:(a,b)=>a+' waiting'+(b?' · '+b+' over 24 h':''),okT:'Approved!',okS:'Send this to the parent so the child can log in:',autoMail:'An automatic email was also sent.',close:'Close',rejT:'Reject request',rejS:'You can write the reason (optional):',reasons:['Not enrolled at the school','Incomplete information','Duplicate request'],confirm:'Confirm',cancel:'Cancel',again:'Approve anyway',reason:'Reason',err:'Something went wrong. Check your connection.',hello:'Hello',start:'Starts at',fromStart:'From the beginning',uw:(u,w)=>'Unit '+u+' · Week '+w,startHint:'Weeks before this one show as already done (covered in class).',badNum:'The WhatsApp number needs 10 digits (e.g. 809 555 1234) or a country code.',pickChat:'No number: WhatsApp opens with the message and you pick the chat.'}};
const _f=window.fetch.bind(window);let TK=localStorage.getItem('adm_tk')||'';
window.fetch=(u,o={})=>{o.headers=Object.assign({'x-admin-token':TK},o.headers||{});return _f(u,o).then(r=>{if(r.status==401&&String(u).startsWith('/api/')&&u!='/api/admin-login')needLogin();return r})};
function needLogin(){if($('ac'))return;open_(`<h2>${T('adminT')}</h2><p>${T('adminS')}</p><input id=ac type=password placeholder="${T('adminPh')}" onkeydown="if(event.key=='Enter')adminLogin()" style="width:100%;padding:12px;border-radius:12px;border:2px solid #ddd6f5;font-size:18px"><div id=ae style="color:#d64545;min-height:22px;margin:6px 0"></div><button class="bt" onclick="adminLogin()">${T('enter')}</button>`);setTimeout(()=>$('ac')&&$('ac').focus(),60)}
async function adminLogin(){const r=await fetch('/api/admin-login',{method:'POST',body:JSON.stringify({code:$('ac').value})}),j=await r.json();if(!r.ok){$('ae').textContent=j.error||T('err');return}TK=j.token;localStorage.setItem('adm_tk',TK);close_();load()}
let lg=localStorage.getItem('adm_lg')||'es',tab='pending',all=[];const T=k=>TT[lg][k],$=id=>document.getElementById(id),H=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'),ORG=location.origin;
function L(x){lg=x;localStorage.setItem('adm_lg',x);document.documentElement.lang=x;document.querySelectorAll('[data-k]').forEach(e=>{const v=T(e.dataset.k);if(e.tagName=='INPUT')e.placeholder=v;else e.textContent=v});$('l-es').className=x=='es'?'on':'';$('l-en').className=x=='en'?'on':'';draw()}
const msg=r=>`Hola ${r.parent}, la cuenta de ${r.child} fue aprobada.\nUsuario: ${r.username}\nEntra en: ${ORG}\nVálida por 1 año.\n\nHello ${r.parent}, ${r.child}'s account is approved.\nUsername: ${r.username}\nOpen: ${ORG}\nValid for 1 year.`;
// Grade 0 = PF. WhatsApp needs the country code: a 10-digit number (809/829/849, US) gets a 1 in front.
const GL=g=>+g===0?'PF':g,gOpts=v=>[0,1,2,3,4,5,6].map(n=>`<option value=${n} ${n==v?'selected':''}>${GL(n)}</option>`).join('');
const waNum=c=>{let d=String(c||'').replace(/\D/g,'').replace(/^00/,'');if(d.length==10)d='1'+d;return d.length>=11&&d.length<=15?d:''};
// No usable number (e.g. the parent gave an email): WhatsApp opens with the message and you pick the chat.
const waLink=(c,m)=>{const d=waNum(c);return `https://wa.me/${d}?text=${encodeURIComponent(m)}`};
// Start week: classes began in September, so a new child usually starts mid-year. Suggest the current school week.
function weekNow(){const n=new Date(),y=n.getMonth()>=7?n.getFullYear():n.getFullYear()-1,w=Math.floor((n-new Date(y,8,1))/6048e5);if(w<1)return'';const u=Math.min(6,Math.floor(w/5)+1);return u+'-'+(u==6&&w>=30?5:w%5+1)}
const stOpts=v=>`<option value="">${T('fromStart')}</option>`+[1,2,3,4,5,6].map(u=>[1,2,3,4,5].map(w=>`<option value="${u}-${w}" ${v==u+'-'+w?'selected':''}>${T('uw')(u,w)}</option>`).join('')).join('');
function waBtns(r,m){return `<a class="bt wa" target=_blank href="${waLink(r.contact,m)}" title="${waNum(r.contact)?'':T('pickChat')}">${T('wa')}${waNum(r.contact)?'':' …'}</a>`}
function toast(m){const t=$('toast');t.textContent=m;t.className='on';setTimeout(()=>t.className='',2200)}
function cp(s){navigator.clipboard.writeText(s).then(()=>toast(T('copied')),()=>toast(s))}
async function post(u,b){try{const r=await fetch(u,{method:'POST',body:JSON.stringify(b)}),j=await r.json();if(!r.ok){if(r.status!=401)toast(j.error||T('err'));throw 0}return j}catch(e){if(e)toast(T('err'));throw e}}
async function load(){try{const r=await fetch('/api/requests');if(r.ok)all=await r.json()}catch(e){toast(T('err'))}draw()}
const hrs=r=>Math.floor((Date.now()-r.created)/36e5),late=r=>r.status=='pending'&&hrs(r)>=24;
function draw(){const n=s=>all.filter(r=>s=='all'||r.status==s).length,lt=all.filter(late).length;
 $('sum').textContent=T('sumA')(n('pending'),lt);
 $('tabs').innerHTML=['pending','approved','rejected','all'].map(s=>`<div class="tab ${tab==s?'on':''}" onclick="tab='${s}';draw()">${T(s)}<i>${n(s)}</i></div>`).join('');
 const q=$('q').value.toLowerCase().trim();let l=all.filter(r=>(tab=='all'||r.status==tab)&&(!q||[r.child,r.parent,r.contact,r.username,r.id,r.school].join(' ').toLowerCase().includes(q)));
 if(tab=='pending')l.sort((a,b)=>a.created-b.created);
 $('list').innerHTML=l.map(card).join('')||`<div class=empty>${T('nothing')}</div>`}
function card(r){const d=r.contact.replace(/\D/g,''),h=hrs(r),lt=late(r);const m=encodeURIComponent(msg(r));
 const badge=r.status=='pending'?`<span class="b ${lt?'late':'wait'}">${lt?T('overdue'):T('waiting')}</span>`:r.status=='approved'?`<span class="b ok">${T('appr')}</span>`:`<span class="b no">${T('rej')}</span>`;
 let a='';
 if(r.status=='pending')a=`<div class=act><div><label>${T('grade')}</label><select id="g${r.id}">${gOpts(r.grade)}</select></div><div><label>${T('start')}</label><select id="st${r.id}" title="${T('startHint')}">${stOpts(weekNow())}</select></div><div><label>${T('school')}</label><input id="s${r.id}" list=sch value="${H(r.school)}"></div><div><label>${T('user')}</label><input id="u${r.id}" placeholder="${T('auto')}" style="width:150px"></div><button class="bt ok" onclick="ap('${r.id}')">${T('approve')}</button><button class="bt no" onclick="rj('${r.id}')">${T('reject')}</button></div>`;
 else if(r.status=='approved')a=`<div class=act><div><label>${T('user')}</label><span class=user onclick="cp('${H(r.username)}')" title="${T('copy')}">${H(r.username)}</span></div><div class=row style="margin:0"><span>${T('until')} <b>${new Date(r.exp).toLocaleDateString()}</b></span></div></div><div class=act style="border:0;padding-top:0">${waBtns(r,msg(r))}${/@/.test(r.contact)?`<a class="bt" href="mailto:${H(r.contact)}?subject=At Home&body=${m}">${T('mail')}</a>`:''}<button class="bt ghost" onclick="cm('${r.id}')">${T('msg')}</button><button class="bt ghost" onclick="ed('${r.id}')">${T('edit')}</button><button class="bt ghost" onclick="rn('${r.id}')">${T('renew')}</button></div>`;
 else a=`<div class=act><span class=row style="margin:0">${T('reason')}: <b>${H(r.reason||'—')}</b></span><button class="bt ok" onclick="ap('${r.id}')">${T('again')}</button></div>`;
 return `<div class="card ${lt?'late':r.status}"><div class=top><div><span class=nm>${H(r.child)}</span><span class=chip>${+r.grade===0?'PF':T('grade')+' '+r.grade}</span>${r.start?`<span class=chip>${T('start')} ${T('uw')(...r.start.split('-'))}</span>`:''}<span class=chip>${H(r.school)}</span></div>${badge}</div>
 <div class=row><span>${T('parent')}: <b>${H(r.parent)}</b></span><span>${T('contact')}: <b class=cp onclick="cp('${H(r.contact)}')">${H(r.contact)}</b></span><span>${T('code')}: ${r.id}</span><span>${T('sent')} ${h} ${lg=='es'?'h':T('h_')}${r.status=='pending'&&!lt?' · '+(24-h)+' h '+T('left'):''}</span></div>${a}</div>`}
function open_(html){$('md').innerHTML=html;$('ov').className='ov on'}function close_(){$('ov').className='ov';$('md').innerHTML=''}
async function ap(id){const g=$('g'+id),s=$('s'+id),u=$('u'+id),j=await post('/api/approve',{id,grade:g?g.value:undefined,school:s?s.value:undefined,username:u&&u.value?u.value:undefined,start:$('st'+id)?$('st'+id).value:undefined});await load();const r=all.find(x=>x.id==id),d=r.contact.replace(/\D/g,''),m=encodeURIComponent(j.message);
 open_(`<h2>${T('okT')}</h2><p>${T('okS')}</p><div class=big>${H(j.username)}</div><div class=act style="border:0">${waBtns(r,j.message)}${/@/.test(r.contact)?`<a class="bt" href="mailto:${H(r.contact)}?subject=At Home&body=${m}">${T('mail')}</a>`:''}<button class="bt ghost" onclick="cp(${JSON.stringify(j.message).replace(/"/g,'&quot;')})">${T('msg')}</button></div>${j.emailed?`<p>${T('autoMail')}</p>`:''}<button class="bt" onclick="close_()">${T('close')}</button>`)}
function rj(id){open_(`<h2>${T('rejT')}</h2><p>${T('rejS')}</p><div class=chips>${T('reasons').map(x=>`<span onclick="$('rr').value=this.textContent">${x}</span>`).join('')}</div><textarea id=rr></textarea><div class=act style="border:0"><button class="bt no" onclick="rj2('${id}')">${T('confirm')}</button><button class="bt ghost" onclick="close_()">${T('cancel')}</button></div>`)}
async function rj2(id){await post('/api/reject',{id,reason:$('rr').value});close_();tab='rejected';load()}
async function rn(id){if(!confirm(T('renewq')))return;await post('/api/renew',{id});toast(T('renewed'));load()}
function ed(id){const r=all.find(x=>x.id==id);open_(`<h2>${T('editT')}</h2><div class=act style="border:0;display:grid;gap:10px"><div><label>${T('child')}</label><input id=ec value="${H(r.child)}" style="width:100%"></div><div><label>${T('user')} <small>(${T('userHint')})</small></label><input id=eu value="${H(r.username||'')}" style="width:100%"></div><div><label>${T('expiry')}</label><input id=ex type=date value="${new Date(r.exp||Date.now()).toISOString().slice(0,10)}" style="width:100%"><div class=chips><span onclick="xd(365)">${T('plus1y')}</span><span onclick="xd(183)">${T('plus6m')}</span><span onclick="xd(0,1)">${T('today')}</span></div></div><div style="display:flex;gap:8px"><div style="flex:1"><label>${T('grade')}</label><select id=eg style="width:100%">${gOpts(r.grade)}</select></div><div style="flex:2"><label>${T('school')}</label><input id=es list=sch value="${H(r.school)}" style="width:100%"></div></div><div><label>${T('start')} <small>(${T('startHint')})</small></label><select id=est style="width:100%">${stOpts(r.start||'')}</select></div></div><div class=act style="border:0"><button class="bt ok" onclick="ed2('${id}')">${T('save')}</button><button class="bt ghost" onclick="close_()">${T('cancel')}</button></div>`)}
function xd(n,t){const e=$('ex'),b=t?new Date():new Date(e.value+'T12:00:00');b.setDate(b.getDate()+n);e.value=b.toISOString().slice(0,10)}
async function ed2(id){await post('/api/update',{id,child:$('ec').value,username:$('eu').value,exp:$('ex').value,grade:$('eg').value,school:$('es').value,start:$('est').value});close_();toast(T('saved'));load()}
function cm(id){cp(msg(all.find(r=>r.id==id)))}
document.body.insertAdjacentHTML('beforeend','<datalist id=sch><option value="Colegio Continental"></datalist>');
L(lg);if(location.hostname=='localhost')document.querySelector('a[href="/review.html"]').style.display='';load();setInterval(load,60000);
</script></html>
